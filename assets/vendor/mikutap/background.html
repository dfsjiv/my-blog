<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Mikutap Background</title>
  <link rel="stylesheet" href="css/css.css" />
  <link rel="stylesheet" href="shared/sp/css/common.css" />
  <link rel="stylesheet" href="css/mikutap.css" />
  <style>
    #scene_top,
    #scene_loading,
    #scene_main,
    #about,
    #about_cover,
    #bt_back,
    #bt_fs {
      display: none !important;
    }

    html,
    body,
    #view,
    #view canvas {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
  <script src="js/jquery.min.js"></script>
  <script src="js/pixi.min.js"></script>
  <script src="js/gsap.min.js"></script>
  <script src="shared/js/common-2.min.js"></script>
  <script src="js/mikutap.js"></script>
</head>
<body>
  <div id="view"></div>
  <div id="scene_top" aria-hidden="true">
    <div class="ok"><p id="bt_start"><a href="#">开始</a></p></div>
  </div>
  <div id="scene_loading" aria-hidden="true"><hr /></div>
  <div id="scene_main" aria-hidden="true"></div>
  <script>
    var loginMikutapVisualActive = true;

    function pulseMikutapWhileAudioIsBlocked() {
      if (!loginMikutapVisualActive || !window.jQuery) return;
      var context = window.aidn && window.aidn.___waContext;
      if (context && context.state === 'running') return;
      var pulseCount = Math.random() < 0.35 ? 2 : 1;
      for (var index = 0; index < pulseCount; index += 1) {
        var keyCode = 48 + Math.floor(Math.random() * 43);
        window.jQuery(window).trigger(window.jQuery.Event('keydown', {
          keyCode: keyCode,
          which: keyCode
        }));
        window.jQuery(window).trigger(window.jQuery.Event('keyup', {
          keyCode: keyCode,
          which: keyCode
        }));
      }
    }

    window.addEventListener('DOMContentLoaded', function () {
      window.setTimeout(function () {
        var startButton = document.querySelector('#bt_start a');
        if (startButton) startButton.click();
      }, 80);
      window.setInterval(pulseMikutapWhileAudioIsBlocked, 210);
    });

    function resumeMikutapAudio() {
      loginMikutapVisualActive = true;
      if (window.aidn
        && window.aidn.___waContext
        && window.aidn.___waContext.state === 'suspended') {
        window.aidn.___waContext.resume().catch(function () {});
      }
    }

    window.pauseMikutapAudio = function () {
      loginMikutapVisualActive = false;
      if (window.aidn
        && window.aidn.___waContext
        && window.aidn.___waContext.state === 'running') {
        return window.aidn.___waContext.suspend().catch(function () {});
      }
      return Promise.resolve();
    };

    window.setMikutapVisualActive = function (active) {
      loginMikutapVisualActive = Boolean(active);
    };

    window.addEventListener('pointerdown', resumeMikutapAudio, { passive: true });
    window.addEventListener('keydown', resumeMikutapAudio);

    window.loginMikutapPointerDown = function (x, y) {
      if (!window.jQuery) return;
      resumeMikutapAudio();
      window.jQuery('#view').trigger(window.jQuery.Event('mousedown', {
        pageX: x,
        pageY: y
      }));
    };

    window.loginMikutapPointerMove = function (x, y) {
      if (!window.jQuery) return;
      window.jQuery(window).trigger(window.jQuery.Event('mousemove', {
        pageX: x,
        pageY: y
      }));
    };

    window.loginMikutapPointerUp = function () {
      if (window.jQuery) window.jQuery(window).trigger(window.jQuery.Event('mouseup'));
    };

    window.loginMikutapKeyDown = function (keyCode) {
      if (!window.jQuery) return;
      resumeMikutapAudio();
      window.jQuery(window).trigger(window.jQuery.Event('keydown', {
        keyCode: keyCode,
        which: keyCode
      }));
    };

    window.loginMikutapKeyUp = function (keyCode) {
      if (!window.jQuery) return;
      window.jQuery(window).trigger(window.jQuery.Event('keyup', {
        keyCode: keyCode,
        which: keyCode
      }));
    };
  </script>
</body>
</html>
