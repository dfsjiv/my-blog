<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Mikutap Background</title>
  <link rel="stylesheet" href="css/css.css" />
  <link rel="stylesheet" href="shared/sp/css/common.css" />
  <link rel="stylesheet" href="css/mikutap.css" />
  <style>
    #scene_top,
    #scene_loading,
    #scene_main,
    #about,
    #about_cover,
    #bt_back,
    #bt_fs {
      display: none !important;
    }

    html,
    body,
    #view,
    #view canvas {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
  <script src="js/jquery.min.js"></script>
  <script src="js/pixi.min.js"></script>
  <script src="js/gsap.min.js"></script>
  <script src="shared/js/common-2.min.js"></script>
  <script src="js/mikutap.js?v=20260807-input-idle-2"></script>
</head>
<body>
  <div id="view"></div>
  <div id="scene_top" aria-hidden="true">
    <div class="ok"><p id="bt_start"><a href="#">开始</a></p></div>
  </div>
  <div id="scene_loading" aria-hidden="true"><hr /></div>
  <div id="scene_main" aria-hidden="true"></div>
  <script>
    var loginMikutapVisualActive = true;
    var pendingMikutapAction = null;

    // Automatic login backgrounds must not wait for browser audio permission.
    window.loginMikutapStartVisualsImmediately = true;
    // Keep input-driven effects, but disable Mikutap's music timeline effects.
    window.loginMikutapDisableTimeline = true;

    function runWhenMikutapReady(action) {
      if (window.loginMikutapReady) {
        action();
        return;
      }

      pendingMikutapAction = action;
    }

    window.addEventListener('loginMikutapReady', function () {
      if (!pendingMikutapAction) return;
      var action = pendingMikutapAction;
      pendingMikutapAction = null;
      action();
    });

    window.jQuery(function () {
      var startButton = document.querySelector('#bt_start a');
      if (startButton) window.jQuery(startButton).trigger('click');
    });

    function resumeMikutapAudio() {
      loginMikutapVisualActive = true;
      if (window.aidn
        && window.aidn.___waContext
        && window.aidn.___waContext.state === 'suspended') {
        window.aidn.___waContext.resume().catch(function () {});
      }
    }

    window.pauseMikutapAudio = function () {
      loginMikutapVisualActive = false;
      if (window.aidn
        && window.aidn.___waContext
        && window.aidn.___waContext.state === 'running') {
        return window.aidn.___waContext.suspend().catch(function () {});
      }
      return Promise.resolve();
    };

    window.setMikutapVisualActive = function (active) {
      loginMikutapVisualActive = Boolean(active);
    };

    window.addEventListener('pointerdown', resumeMikutapAudio, { passive: true });
    window.addEventListener('keydown', resumeMikutapAudio);

    window.loginMikutapPointerDown = function (x, y) {
      resumeMikutapAudio();
      runWhenMikutapReady(function () {
        if (window.loginMikutapChangeAtPoint) {
          window.loginMikutapChangeAtPoint(x, y, false);
        }
      });
    };

    window.loginMikutapPointerMove = function (x, y) {
      if (window.loginMikutapReady && window.loginMikutapChangeAtPoint) {
        window.loginMikutapChangeAtPoint(x, y, true);
      }
    };

    window.loginMikutapPointerUp = function () {
      if (window.loginMikutapChangeId) window.loginMikutapChangeId(-1);
    };

    window.loginMikutapKeyDown = function (keyCode) {
      resumeMikutapAudio();
      runWhenMikutapReady(function () {
        if (!window.loginMikutapChangeId) return;
        var effectId = keyCode >= 65
          ? keyCode - 55
          : keyCode >= 48
            ? keyCode - 48
            : keyCode;
        window.loginMikutapChangeId(effectId);
        window.setTimeout(function () {
          window.loginMikutapChangeId(-1);
        }, 0);
      });
    };

    window.loginMikutapKeyUp = function (keyCode) {
      if (window.loginMikutapChangeId) window.loginMikutapChangeId(-1);
    };
  </script>
</body>
</html>
